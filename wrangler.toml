# Cloudflare — nama harus sama dengan project di dashboard.
name = "my-portofolio"
compatibility_date = "2026-11-17"

# Deploy statis: hasil `npm run build` ada di folder dist/.
# Ini membuat `npx wrangler deploy` tahu harus upload apa tanpa perlu field "build output" di dashboard.
[assets]
directory = "./dist"
